name: QA ElaboradorOFF - documento e botões
on:
  push:
    branches: ["main", "ui/organizar-botoes-20261015"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar bibliotecas de testes
        run: |
          npm install --no-save playwright pdf-lib jspdf html2canvas
          npx playwright install --with-deps chromium webkit
      - name: Preparar versão A4 de referência
        run: |
          mkdir -p qa-baseline
          git show 5d3c636e661e5746a1a439fbcb7fb2334a76b96d:index.html > qa-baseline/index.html
      - name: Executar regressão do PDF e da interface
        run: |
          node tests/pdf-regression.mjs
          node tests/ui-regression.mjs
      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-pdf
          path: qa-output/
          if-no-files-found: ignore
